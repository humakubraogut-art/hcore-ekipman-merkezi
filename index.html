<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>H-CORE | Dijital Ekipman Merkezi</title><style>
:root{--ink:#123b38;--teal:#086453;--orange:#ef8b25;--bg:#f2f5f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203734;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:white;border-bottom:4px solid var(--orange);padding:16px max(20px,calc((100% - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:205px;max-width:42vw}header strong{color:var(--ink)}main{max-width:1140px;margin:30px auto;padding:0 18px}.hero{background:var(--ink);color:white;padding:26px;border-radius:18px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;opacity:.83}.search{padding:15px;border:1px solid #cbd8d5;border-radius:12px;width:100%;font:inherit;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.tile,.panel{background:white;border-radius:15px;box-shadow:0 3px 14px #10372a10;overflow:hidden}.tile img{width:100%;height:145px;object-fit:contain;background:#f7f8f8;padding:10px}.tile .content{padding:17px}.muted{color:#617570;font-size:13px}.tile h3{margin:8px 0}.pill{display:inline-block;background:#e5f2ee;color:#00624e;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.btn{border:0;background:var(--teal);color:white;padding:11px 15px;border-radius:10px;cursor:pointer;font:inherit;font-weight:650}.btn.alt{background:#e8eeec;color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.detail{display:none}.detail.show{display:block}.back{margin-bottom:15px}.profile{display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:20px}.profile>img{width:100%;height:260px;object-fit:contain;background:#f7f8f8;border-radius:14px}.panel{padding:20px;margin-bottom:17px}.panel h2{margin:0 0 15px;font-size:19px;color:var(--ink)}.note{background:#f0f6f3;padding:15px;border-radius:10px;line-height:1.6}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4ebe8;font-size:13px}th{background:#eaf1ef;color:var(--ink)}.card-preview{width:16cm;height:8cm;display:grid;grid-template-columns:43% 57%;border:2px solid #07553e;border-radius:15px;background:#fff;overflow:hidden;color:#132b3c;font-family:Arial,Helvetica,sans-serif}.card-left{padding:11px 12px 8px;display:flex;flex-direction:column;min-width:0;border-right:2px solid #0b684e}.card-left .logo{width:190px;max-width:100%;height:44px;object-fit:contain;object-position:left center}.card-left .machine{width:100%;height:202px;min-height:0;object-fit:contain;margin:auto 0}.card-left .foot{font-size:9px;color:#0b5b45;border-top:1px solid #0b684e;padding-top:6px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-weight:700}.card-left .foot span:last-child{font-weight:500;color:#38504d}.card-right{padding:13px 13px 9px;display:flex;flex-direction:column;gap:6px;min-width:0}.card-right .heading{font-size:16px;line-height:1.12;font-weight:800;color:#102a40;overflow-wrap:anywhere;max-height:57px;overflow:hidden}.card-right .subtitle{font-size:10px;color:#64747d;margin-top:3px}.card-right .platebox{background:#eaf5ef;border:1px solid #b7dac7;border-radius:7px;padding:6px 9px;display:flex;align-items:center;gap:10px;font-size:12px}.card-right .platebox b{color:#07543d;font-size:11px}.card-right .platebox strong{font-size:15px;letter-spacing:.3px;color:#142c3e}.card-right .bottom{display:grid;grid-template-columns:121px minmax(0,1fr);gap:10px;align-items:center;flex:1;min-height:0}.card-right .qrframe{border:1.5px solid #0b684e;border-radius:9px;padding:7px;background:#fff;display:flex;align-items:center;justify-content:center}.card-right .qr{width:105px;height:105px;object-fit:contain;image-rendering:pixelated}.card-right .qrhint{font-size:8px;text-align:center;margin-top:3px;color:#64747d}.card-right .features{min-width:0}.card-right .scan{font-size:13px;font-weight:800;color:#07543d;line-height:1.2;border-bottom:1px solid #0b684e;padding-bottom:6px;margin-bottom:6px}.card-right .feature{font-size:10px;line-height:1.65;color:#183448;white-space:nowrap}.card-right .feature::before{content:'✓';color:#0b684e;font-weight:900;margin-right:6px}.card-right .footnote{font-size:8px;color:#6a7977;text-align:right}.print-only{display:none}@media(max-width:650px){.profile{grid-template-columns:1fr}.card-preview{transform:scale(.52);transform-origin:top left;margin-bottom:-3.75cm}.hero h1{font-size:23px}header strong{font-size:12px}}@page{size:16cm 8cm;margin:0}@media print{body{background:white}header,main>.hero,.search,.grid,.back,.panel,.actions,.muted,.screen-only{display:none!important}main{margin:0;padding:0;max-width:none}.detail{display:none!important}.print-only{display:block!important}.card-preview{width:16cm!important;height:8cm!important;transform:none!important;margin:0!important;border-radius:0;break-after:page}.card-preview:last-child{break-after:auto}} </style></head><body><header><img src="assets/hareket_logo.png" alt="HAREKET"><strong>H-CORE · EKİPMAN MERKEZİ</strong></header><main><section class="hero"><h1>Dijital Ekipman ve Bakım Merkezi</h1><p>7 ekipmanlık pilot · Bakım geçmişi · Filtre listesi · Ekipmana özel QR kartları</p></section><div id="home"><input id="search" class="search" placeholder="Makine adı, plaka veya model ara…"><div id="grid" class="grid"></div><div class="actions"><button class="btn alt" onclick="printAll()">7 QR kartını toplu yazdır</button></div></div><section id="detail" class="detail"></section><div id="printArea" class="print-only"></div></main><script>
let equipment=[];const byId=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(e){const model=String(e.description||e.name||'').replace(new RegExp('\\s*'+String(e.plate||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*$','i'),'').trim()||e.name;return `<div class="card-preview"><div class="card-left"><img class="logo" src="assets/hareket_logo.png" alt="HAREKET orijinal logo"><img class="machine" src="${safe(e.image)}" alt="${safe(e.name)}"><div class="foot"><span>${safe(e.name)}</span><span>Dijital bakım ve kontrol takibi</span></div></div><div class="card-right"><div><div class="heading">${safe(model)}</div><div class="subtitle">${safe(e.name)} · H-CORE Dijital Ekipman Kimliği</div></div><div class="platebox"><b>PLAKA / EKİPMAN NO</b><strong>${safe(e.plate)}</strong></div><div class="bottom"><div><div class="qrframe"><img class="qr" src="${safe(e.qr)}" alt="${safe(e.plate)} için gerçek QR"></div><div class="qrhint">${safe(e.plate)}</div></div><div class="features"><div class="scan">Tara → Bakım Paneli</div><div class="feature">Bakım kaydı</div><div class="feature">Filtreler</div><div class="feature">Araç bilgisi</div><div class="feature">Periyodik kontrol raporu</div></div></div><div class="footnote">H-CORE • Ekipmana özel dijital bakım kartı</div></div></div>`}
function renderList(){let q=byId('search').value.toLocaleLowerCase('tr');byId('grid').innerHTML=equipment.filter(e=>(e.plate+' '+e.name+' '+e.description).toLocaleLowerCase('tr').includes(q)).map(e=>`<article class="tile"><img src="${e.image}" alt="${safe(e.name)}"><div class="content"><span class="pill">${safe(e.scope)}</span><h3>${safe(e.name)}</h3><div class="muted">${safe(e.plate)} · ${e.filters.length} filtre</div><div class="muted">Son bakım: ${safe(e.maintenanceDate||'Belirtilmedi')}</div><div class="actions"><button class="btn" onclick="show('${e.plate}')">Bakım panelini aç</button></div></div></article>`).join('')}
function show(id){let e=equipment.find(x=>x.plate===id);if(!e)return;history.replaceState(null,'','?ekipman='+encodeURIComponent(id));byId('home').style.display='none';byId('detail').classList.add('show');byId('detail').innerHTML=`<button class="btn alt back" onclick="home()">← Tüm ekipmanlar</button><div class="panel"><div class="profile"><img src="${e.image}" alt="${safe(e.name)}"><div><span class="pill">${safe(e.scope)}</span><h1>${safe(e.name)}</h1><p><b>Plaka / Ekipman no:</b> ${safe(e.plate)}</p><p><b>Tanım:</b> ${safe(e.description)}</p><p><b>Son bakım:</b> ${safe(e.maintenanceDate||'Belirtilmedi')}</p><div class="actions"><button class="btn" onclick="printOne('${e.plate}')">16 × 8 cm QR kartını yazdır</button></div></div></div></div><div class="panel"><h2>Bakım açıklaması</h2><div class="note">${safe(e.maintenanceNote||'Bakım bilgisi bulunamadı.')}</div></div><div class="panel"><h2>Filtre listesi (${e.filters.length})</h2><div class="tablewrap"><table><thead><tr><th>Malzeme kodu</th><th>Filtre açıklaması</th><th>Adet</th><th>Lot / alternatif kodlar</th></tr></thead><tbody>${e.filters.map(f=>`<tr><td>${safe(f.code)}</td><td>${safe(f.name)}</td><td>${safe(f.quantity)}</td><td>${safe([f.alternative,f.lot1,f.lot2,f.lot3].filter(Boolean).join(' / '))}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>QR kartı önizlemesi</h2>${card(e)}</div>`;window.scrollTo(0,0)}
function home(){history.replaceState(null,'',location.pathname);byId('home').style.display='block';byId('detail').classList.remove('show');window.scrollTo(0,0)}function printOne(id){byId('printArea').innerHTML=card(equipment.find(x=>x.plate===id));window.print()}function printAll(){byId('printArea').innerHTML=equipment.map(card).join('');window.print()}
fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{equipment=data.equipment;renderList();const id=new URLSearchParams(location.search).get('ekipman');if(id)show(id);byId('search').addEventListener('input',renderList)}).catch(err=>{byId('grid').innerHTML='<p>Veri dosyası açılamadı. Uygulamayı GitHub Pages üzerinden açın; bilgisayarda doğrudan HTML dosyasını açmak yeterli değildir.</p>';console.error(err)});
</script></body></html>
