<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>H-CORE | Dijital Ekipman Merkezi</title><style>
:root{--ink:#123b38;--teal:#086453;--orange:#ef8b25;--bg:#f2f5f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203734;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:white;border-bottom:4px solid var(--orange);padding:16px max(20px,calc((100% - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:205px;max-width:42vw}header strong{color:var(--ink)}main{max-width:1140px;margin:30px auto;padding:0 18px}.hero{background:var(--ink);color:white;padding:26px;border-radius:18px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;opacity:.83}.search{padding:15px;border:1px solid #cbd8d5;border-radius:12px;width:100%;font:inherit;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.tile,.panel{background:white;border-radius:15px;box-shadow:0 3px 14px #10372a10;overflow:hidden}.tile img{width:100%;height:145px;object-fit:contain;background:#f7f8f8;padding:10px}.tile .content{padding:17px}.muted{color:#617570;font-size:13px}.tile h3{margin:8px 0}.pill{display:inline-block;background:#e5f2ee;color:#00624e;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.btn{border:0;background:var(--teal);color:white;padding:11px 15px;border-radius:10px;cursor:pointer;font:inherit;font-weight:650}.btn.alt{background:#e8eeec;color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.detail{display:none}.detail.show{display:block}.back{margin-bottom:15px}.profile{display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:20px}.profile>img{width:100%;height:260px;object-fit:contain;background:#f7f8f8;border-radius:14px}.panel{padding:20px;margin-bottom:17px}.panel h2{margin:0 0 15px;font-size:19px;color:var(--ink)}.note{background:#f0f6f3;padding:15px;border-radius:10px;line-height:1.6}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4ebe8;font-size:13px}th{background:#eaf1ef;color:var(--ink)}.card-preview{width:16cm;height:8cm;display:grid;grid-template-columns:42% 58%;border:2px solid #0a6150;border-radius:12px;background:white;overflow:hidden;color:#153b36}.card-left{padding:13px;display:flex;flex-direction:column;gap:8px}.card-left .logo{width:155px;max-height:39px;object-fit:contain;object-position:left}.card-left .machine{width:100%;height:176px;object-fit:contain}.card-right{padding:15px;display:grid;grid-template-columns:1fr 122px;align-items:center;gap:7px;background:#f5f8f6}.card-right .qr{width:122px;height:122px;object-fit:contain}.card-right h2{font-size:17px;margin:0 0 10px}.card-right p{font-size:12px;margin:5px 0}.card-right .caption{font-size:11px;font-weight:700;text-align:center}.print-only{display:none}@media(max-width:650px){.profile{grid-template-columns:1fr}.card-preview{transform:scale(.58);transform-origin:top left;margin-bottom:-3.3cm}.hero h1{font-size:23px}header strong{font-size:12px}}@page{size:16cm 8cm;margin:0}@media print{body{background:white}header,main>.hero,.search,.grid,.back,.panel,.actions,.muted,.screen-only{display:none!important}main{margin:0;padding:0;max-width:none}.detail{display:none!important}.print-only{display:block!important}.card-preview{width:16cm;height:8cm;transform:none;margin:0;border-radius:0;break-after:page}.card-preview:last-child{break-after:auto}} </style></head><body><header><img src="assets/hareket_logo.png" alt="HAREKET"><strong>H-CORE · EKİPMAN MERKEZİ</strong></header><main><section class="hero"><h1>Dijital Ekipman ve Bakım Merkezi</h1><p>7 ekipmanlık pilot · Bakım geçmişi · Filtre listesi · Ekipmana özel QR kartları</p></section><div id="home"><input id="search" class="search" placeholder="Makine adı, plaka veya model ara…"><div id="grid" class="grid"></div><div class="actions"><button class="btn alt" onclick="printAll()">7 QR kartını toplu yazdır</button></div></div><section id="detail" class="detail"></section><div id="printArea" class="print-only"></div></main><script>
let equipment=[];const byId=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(e){return `<div class="card-preview"><div class="card-left"><img class="logo" src="assets/hareket_logo.png"><img class="machine" src="${e.image}" alt="${safe(e.name)}"></div><div class="card-right"><div><div class="pill">DİJİTAL BAKIM PANELİ</div><h2>${safe(e.name)}</h2><p><b>PLAKA / EKİPMAN NO</b><br>${safe(e.plate)}</p><p>${safe(e.description)}</p><p style="color:#b35a00;font-weight:700">TARA → BAKIM PANELİ</p></div><div><img class="qr" src="${e.qr}" alt="QR"><div class="caption">H-CORE</div></div></div></div>`}
function renderList(){let q=byId('search').value.toLocaleLowerCase('tr');byId('grid').innerHTML=equipment.filter(e=>(e.plate+' '+e.name+' '+e.description).toLocaleLowerCase('tr').includes(q)).map(e=>`<article class="tile"><img src="${e.image}" alt="${safe(e.name)}"><div class="content"><span class="pill">${safe(e.scope)}</span><h3>${safe(e.name)}</h3><div class="muted">${safe(e.plate)} · ${e.filters.length} filtre</div><div class="muted">Son bakım: ${safe(e.maintenanceDate||'Belirtilmedi')}</div><div class="actions"><button class="btn" onclick="show('${e.plate}')">Bakım panelini aç</button></div></div></article>`).join('')}
function show(id){let e=equipment.find(x=>x.plate===id);if(!e)return;history.replaceState(null,'','?ekipman='+encodeURIComponent(id));byId('home').style.display='none';byId('detail').classList.add('show');byId('detail').innerHTML=`<button class="btn alt back" onclick="home()">← Tüm ekipmanlar</button><div class="panel"><div class="profile"><img src="${e.image}" alt="${safe(e.name)}"><div><span class="pill">${safe(e.scope)}</span><h1>${safe(e.name)}</h1><p><b>Plaka / Ekipman no:</b> ${safe(e.plate)}</p><p><b>Tanım:</b> ${safe(e.description)}</p><p><b>Son bakım:</b> ${safe(e.maintenanceDate||'Belirtilmedi')}</p><div class="actions"><button class="btn" onclick="printOne('${e.plate}')">16 × 8 cm QR kartını yazdır</button></div></div></div></div><div class="panel"><h2>Bakım açıklaması</h2><div class="note">${safe(e.maintenanceNote||'Bakım bilgisi bulunamadı.')}</div></div><div class="panel"><h2>Filtre listesi (${e.filters.length})</h2><div class="tablewrap"><table><thead><tr><th>Malzeme kodu</th><th>Filtre açıklaması</th><th>Adet</th><th>Lot / alternatif kodlar</th></tr></thead><tbody>${e.filters.map(f=>`<tr><td>${safe(f.code)}</td><td>${safe(f.name)}</td><td>${safe(f.quantity)}</td><td>${safe([f.alternative,f.lot1,f.lot2,f.lot3].filter(Boolean).join(' / '))}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>QR kartı önizlemesi</h2>${card(e)}</div>`;window.scrollTo(0,0)}
function home(){history.replaceState(null,'',location.pathname);byId('home').style.display='block';byId('detail').classList.remove('show');window.scrollTo(0,0)}function printOne(id){byId('printArea').innerHTML=card(equipment.find(x=>x.plate===id));window.print()}function printAll(){byId('printArea').innerHTML=equipment.map(card).join('');window.print()}
fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{equipment=data.equipment;renderList();const id=new URLSearchParams(location.search).get('ekipman');if(id)show(id);byId('search').addEventListener('input',renderList)}).catch(err=>{byId('grid').innerHTML='<p>Veri dosyası açılamadı. Uygulamayı GitHub Pages üzerinden açın; bilgisayarda doğrudan HTML dosyasını açmak yeterli değildir.</p>';console.error(err)});
</script></body></html>
